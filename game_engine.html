<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum.AI · Game Engine</title><style>:root{--a:#7c6cff}*{box-sizing:border-box}body{margin:0;background:#090a0f;color:#f4f4f5;font:14px Inter,system-ui,sans-serif}.shell{height:100vh;display:grid;grid-template-columns:220px 1fr 280px}.side{border-right:1px solid #27272a;padding:18px;background:#0d0e12}.brand{font-weight:800;font-size:18px;margin-bottom:24px}.side button,.tool{width:100%;text-align:left;background:transparent;border:1px solid #27272a;color:#ddd;padding:10px;border-radius:9px;margin:4px 0;cursor:pointer}.side button.active{border-color:var(--a);background:#18131d}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{height:62px;border-bottom:1px solid #27272a;display:flex;align-items:center;padding:0 20px;gap:10px}.pill{border:1px solid #27272a;border-radius:999px;padding:6px 10px;color:#aaa}.canvasWrap{padding:20px;display:grid;place-items:center}.stage{width:min(920px,95%);aspect-ratio:16/9;border:1px solid #303036;border-radius:18px;background:radial-gradient(circle at 55% 45%,#272136,#0a0b10 65%);position:relative;overflow:hidden;box-shadow:0 0 60px #000}.orb{position:absolute;width:64px;height:64px;border-radius:50%;left:48%;top:44%;background:radial-gradient(circle,#fff 0 8%,var(--a) 30%,transparent 72%);box-shadow:0 0 50px var(--a);transition:.25s}.grid{position:absolute;inset:0;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px;transform:perspective(500px) rotateX(58deg) translateY(30%);transform-origin:center bottom}.controls{display:flex;gap:8px;padding:14px 20px;border-top:1px solid #27272a}.controls button{border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:9px;padding:10px 14px}.controls .primary{background:var(--a);color:#08080a;border-color:var(--a);font-weight:800}.right{border-left:1px iv class="row"><span>Particles</span><span class="status">ON</span></div><div class="row"><span>AI Director</span><span class="status">ASTRA</span></div></div><div class="card"><h3>Console</h3><pre id="log" style="white-space:pre-wrap;color:#aaa;font-size:11px">Engine initialized.\nReady.</pre></div></aside></div><script src="/game_engine.js"></script></body></html>
