<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum.AI App</title><style>body{margin:0;background:#080914;color:#eef;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}section{background:#12172b;border:1px solid #30365b;border-radius:18px;padding:20px;margin:16px 0}button{background:#725cff;color:#fff;border:0;border-radius:10px;padding:11px}input{width:70%;padding:11px;background:#090c18;color:#fff;border:1px solid #3a4165;border-radius:9px}#out{white-space:pre-wrap;min-height:100px}</style></head><body><main><h1>Quantum.AI</h1><p>Standalone KI-Workspace für Quantum- und Meta-KI-Projekte.</p><section><h2>KI-Chat</h2><div id="out">Bereit für deine nächste Idee.</div><p><input id="q" placeholder="Idee oder Frage…"><button onclick="go()">Start</button></p></section><section><h2>Projektarchiv</h2><p>Prototypen · Experimente · Meta-KI · sichere Projektplanung</p></section></main><script>function go(){const q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('out').textContent='Eingabe: '+q+'\n\nQuantum.AI: Lokaler App-Modus aktiv. Ein externes KI-Backend kann über einen sicheren API-Endpunkt angebunden werden.';}</script></body></html>
