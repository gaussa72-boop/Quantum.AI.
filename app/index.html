<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum.AI App</title><style>body{margin:0;background:#080914;color:#eef;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}section{background:#12172b;border:1px solid #30365b;border-radius:18px;padding:20px;margin:16px 0}button{background:#725cff;color:#fff;border:0;border-radius:10px;padding:11px}input{width:70%;padding:11px;background:#090c18;color:#fff;border:1px solid #3a4165;border-radius:9px}#out{white-space:pre-wrap;min-height:100px}</style>
<style id="chatgpt-inspired-ui">
:root{--ui-accent:#5ea8ff;--ui-panel:#111521;--ui-bg:#090b12;--ui-line:rgba(255,255,255,.11);--ui-glow:#5ea8ff33;color-scheme:dark}html{scroll-behavior:smooth}body{background:radial-gradient(ellipse at 50% -10%,var(--ui-glow),transparent 55%),var(--ui-bg);color:#f4f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;border-radius:13px;transition:border-color .18s,box-shadow .18s,transform .18s}input,textarea,select{background:#0c101a;color:#f4f5f7;border:1px solid var(--ui-line);padding:12px 14px}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ui-accent);box-shadow:0 0 0 3px var(--ui-glow)}button{cursor:pointer}button:hover{border-color:var(--ui-accent);box-shadow:0 0 20px var(--ui-glow)}a{color:var(--ui-accent)}[class*=sidebar],aside,nav{backdrop-filter:blur(18px)}[class*=card],[class*=panel]{border-color:var(--ui-line);border-radius:17px}@media(max-width:760px){body{min-height:100dvh}main,.container{max-width:100%;box-sizing:border-box}input,textarea{max-width:100%;box-sizing:border-box}}
</style>
</head><body><main><h1>Quantum.AI</h1><p>Standalone KI-Workspace für Quantum- und Meta-KI-Projekte.</p><section><h2>KI-Chat</h2><div id="out">Bereit für deine nächste Idee.</div><p><input id="q" placeholder="Idee oder Frage…"><button onclick="go()">Start</button></p></section><section><h2>Projektarchiv</h2><p>Prototypen · Experimente · Meta-KI · sichere Projektplanung</p></section></main><script>function go(){const q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('out').textContent='Eingabe: '+q+'\n\nQuantum.AI: Lokaler App-Modus aktiv. Ein externes KI-Backend kann über einen sicheren API-Endpunkt angebunden werden.';}</script></body></html>
