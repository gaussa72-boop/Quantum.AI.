services:
  - type: web
    name: quantum-ai-fixed
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_REASONING_EFFORT
        value: high
      - key: AI_ENABLED
        value: "true"
      - key: ENABLE_WEB_SEARCH
        value: "true"
