<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KI Social</title><style>body{margin:0;font:15px system-ui;background:#070916;color:#eef}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:260px 1fr;gap:18px}.card{background:#10142a;border:1px solid #293052;border-radius:16px;padding:18px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff,#9cf,#725cff);font-weight:800;font-size:25px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:#171d3a;color:#fff;border:1px solid #39426d;border-radius:10px;padding:9px 12px;cursor:pointer}button.active{background:#3c2f8f}#messages{height:430px;overflow:auto;padding:8px}.msg{margin:9px 0;padding:10px 12px;border-radius:12px;background:#171c35;max-width:80%}.me{margin-left:auto;background:#25305a}.composer{display:flex;gap:8px}.composer input{flex:1;background:#080b18;color:#fff;border:1px solid #39426d;border-radius:10px;padding:12px}.agent{padding:10px;border:1px solid #30385e;border-radius:12px;margin:8px 0}.muted{color:#9ba4c7;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>KI Social</h1><p class="muted">Profil • Community-Chat • persönliche KI-Agenten • thematische Bots</p><div class="grid"><aside class="card"><div class="avatar" id="avatar">KI</div><h2 id="name">Dein Profil</h2><p class="muted">online</p><button onclick="editProfile()">Profil bearbeiten</button><h3>Agenten</h3><div id="agents"></div></aside><section class="card"><div class="tabs" id="topics"></div><div id="messages"></div><div class="composer"><input id="input" placeholder="Nachricht schreiben…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Senden</button></div></section></div></main><script>const topics={Allgemein:'Assistent','Quantenformel':'Quanten-Agent','KI & Technik':'Tech-Agent',Programmieren:'Coding-Agent',Gaming:'Game-Agent',Shop:'Shop-Agent',Notizen:'Notiz-Agent',Kreativ:'Creative-Agent'};let topic='Allgemein',data=JSON.parse(localStorage.getItem('ki-social-profile')||'{"name":"Dein Profil"}');name.textContent=data.name;avatar.textContent=data.name.slice(0,2).toUpperCase();Object.keys(topics).forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>selectTopic(t,b);topicsEl.appendChild(b)});document.querySelector('#topics button').classList.add('active');function selectTopic(t,b){topic=t;document.querySelectorAll('#topics button').forEach(x=>x.classList.remove('active'));b.classList.add('active');add('System',topics[t]+' ist aktiv.')}function add(who,text){let d=document.createElement('div');d.className='msg '+(who==='Du'?'me':'');d.innerHTML='<b>'+who+':</b> '+esc(text);messages.appendChild(d);messages.scrollTop=999999}function send(){let i=input,v=i.value.trim();if(!v)return;add('Du',v);i.value='';setTimeout(()=>add(topics[topic],reply(v)),200)}function reply(v){return topic==='Programmieren'?'Coding-Agent: Ich unterstütze Architektur, Code, Tests und Debugging.':topic==='Quantenformel'?'Quanten-Agent: Ich strukturiere Formel, Modell, Simulation und Umsetzung.':topic==='Gaming'?'Game-Agent: Ich unterstütze Gameplay, KI und Mod-Architektur.':topic==='Shop'?'Shop-Agent: Ich unterstütze UX, Produkte, Warenkorb und Checkout.':'Agent: Nachricht empfangen. Dieses Modul kann an eine echte KI/API angebunden werden.'}function editProfile(){let n=prompt('Profilname',data.name);if(n){data.name=n;localStorage.setItem('ki-social-profile',JSON.stringify(data));name.textContent=n;avatar.textContent=n.slice(0,2).toUpperCase()}}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}Object.entries(topics).forEach(([t,a])=>agents.innerHTML+='<div class="agent"><b>'+a+'</b><div class="muted">'+t+'</div></div>');add('System','Willkommen. Thematische Agenten sind getrennt; Nutzer-zu-Nutzer-Chat benötigt einen Backend-Adapter.');</script></body></html>
