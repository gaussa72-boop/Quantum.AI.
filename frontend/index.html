<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum.AI</title>
<style>
:root{--a:#8b7cff;--line:#272a33;--muted:#969ba8}*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 70% 0,#1a1734 0,#08090c 46%);color:#f3f4f6;font:14px Inter,system-ui,sans-serif}.app{height:100%;display:grid;grid-template-columns:250px 1fr}.side{border-right:1px solid var(--line);padding:14px;background:#0e1014e8}.new{width:100%;padding:11px;border:1px solid #343741;border-radius:10px;background:#181a20;color:#fff;text-align:left;cursor:pointer}.brand{font-weight:800;font-size:18px;margin:16px 4px 24px}.nav a{display:block;color:#d2d5dc;text-decoration:none;padding:10px;border-radius:9px;margin:3px 0}.nav .active{background:#1a1c22;border-left:2px solid var(--a)}.status{position:fixed;bottom:16px;color:#737986;font-size:10px}.main{display:grid;grid-template-rows:58px 1fr auto;min-width:0}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px;background:#0b0c10d9}.model{color:#aaa;border:1px solid #343741;border-radius:999px;padding:5px 9px;font-size:11px}.chat{width:min(900px,92%);margin:auto;height:100%;overflow:auto;padding:30px 0 110px}.welcome{text-align:center;margin:15vh 0 20px}.welcome h1{font-size:34px;margin:0 0 10px}.welcome p{color:var(--muted)}.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.quick button{border:1px solid #343741;background:#15171c;color:#ccc;border-radius:999px;padding:8px 12px;cursor:pointer}.m{max-width:800px;margin:18px auto;padding:13px 15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#181a20;border-radius:16px}.ai{border-left:2px solid var(--a)}.composer{width:min(900px,92%);margin:0 auto 18px;display:flex;gap:9px;border:1px solid #3b3e48;border-radius:18px;background:#15171c;padding:9px}.composer input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:10px;font:inherit}.composer button{border:0;border-radius:12px;background:var(--a);color:#09090b;font-weight:800;padding:0 17px;cursor:pointer}.composer button:disabled{opacity:.5}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.chat,.composer{width:94%}}
</style>
</head>
<body><div class="app"><aside class="side"><button class="new" id="newChat">＋ Neuer Chat</button><div class="brand">Quantum.AI</div><div class="nav"><a class="active" href="/">⌁ Chat</a><a href="/health" target="_blank">⚙ Systemstatus</a></div><div class="status">GPT-5.6 Sol · High reasoning · Web Search</div></aside>
<main class="main"><header class="top"><b>Quantum.AI</b><span class="model">GPT-5.6 Sol · High reasoning</span></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><h1>Wie kann ich helfen?</h1><p>Recherche · Analyse · Coding · Mathematik · Projekte</p><div class="quick"><button data-q="Analysiere diese Aufgabe strukturiert und nenne mir die nächsten konkreten Schritte.">Analysieren</button><button data-q="Hilf mir, ein sauberes, produktionsfähiges Programm zu bauen.">Programmieren</button><button data-q="Recherchiere die aktuellen Fakten zu meinem Thema und kennzeichne Unsicherheiten.">Recherchieren</button></div></div></section>
<form class="composer" id="form"><input id="q" placeholder="Nachricht an Quantum.AI …" autocomplete="off"><button id="send">Senden</button></form></main></div>
<script>
const form=document.getElementById('form'),q=document.getElementById('q'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),send=document.getElementById('send'),newChat=document.getElementById('newChat');
let sessionId=localStorage.getItem('quantum_ai_session')||crypto.randomUUID();let history=JSON.parse(localStorage.getItem('quantum_ai_history')||'[]');localStorage.setItem('quantum_ai_session',sessionId);
function save(){localStorage.setItem('quantum_ai_history',JSON.stringify(history.slice(-20)))}function add(text,role,saveIt=true){const e=document.createElement('div');e.className='m '+role;e.textContent=text;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;if(saveIt){history.push({role:role==='user'?'user':'assistant',content:text});save()}return e}
for(const item of history.slice(-20))add(item.content,item.role==='user'?'user':'ai',false);if(history.length)welcome.style.display='none';
newChat.onclick=()=>{fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})}).catch(()=>{});sessionId=crypto.randomUUID();history=[];localStorage.setItem('quantum_ai_session',sessionId);save();document.querySelectorAll('.m').forEach(e=>e.remove());welcome.style.display='block';q.focus()};
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;q.focus()});
form.onsubmit=async e=>{e.preventDefault();const text=q.value.trim();if(!text)return;welcome.style.display='none';add(text,'user');q.value='';send.disabled=true;send.textContent='Denke …';const pending=add('Quantum.AI arbeitet …','ai',false);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text,history})});const d=await r.json();pending.remove();if(d.session_id){sessionId=d.session_id;localStorage.setItem('quantum_ai_session',sessionId)}add(d.ok?(d.response||d.answer||'Keine Antwort erhalten.'):d.error||'Die KI konnte keine Antwort erzeugen.','ai')}catch(_){pending.remove();add('Verbindung fehlgeschlagen. Prüfe Render und den KI-Dienst.','ai')}finally{send.disabled=false;send.textContent='Senden';q.focus()}};
</script></body></html>
