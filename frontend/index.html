<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantumAI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header><div class="orb"></div><div><h1>QuantumAI</h1><p>Quantum Cat Chat</p></div></header>
    <section id="messages" class="messages" aria-live="polite">
      <div class="message ai">QuantumAI ist online. Wie kann ich dir helfen?</div>
    </section>
    <form id="chatForm" class="composer">
      <input id="input" autocomplete="off" placeholder="Nachricht an QuantumAI…" aria-label="Nachricht">
      <button>SEND</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
