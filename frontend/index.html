const API_BASE=location.hostname==='quantumai-chat.onrender.com'?'https://quantum-ai-zeah.onrender.com':'';
const form=document.getElementById('form'),q=document.getElementById('q'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),send=document.getElementById('send'),newChat=document.getElementById('newChat');
let sessionId=localStorage.getItem('quantum_ai_session')||crypto.randomUUID();let history=JSON.parse(localStorage.getItem('quantum_ai_history')||'[]');localStorage.setItem('quantum_ai_session',sessionId);
function save(){localStorage.setItem('quantum_ai_history',JSON.stringify(history.slice(-20)))}function add(text,role,saveIt=true){const e=document.createElement('div');e.className='m '+role;e.textContent=text;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;if(saveIt){history.push({role:role==='user'?'user':'assistant',content:text});save()}return e}
for(const item of history.slice(-20))add(item.content,item.role==='user'?'user':'ai',false);if(history.length)welcome.style.display='none';
newChat.onclick=()=>{fetch(API_BASE+'/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})}).catch(()=>{});sessionId=crypto.randomUUID();history=[];localStorage.setItem('quantum_ai_session',sessionId);save();document.querySelectorAll('.m').forEach(e=>e.remove());welcome.style.display='block';q.focus()};
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;q.focus()});
form.onsubmit=async e=>{e.preventDefault();const text=q.value.trim();if(!text)return;welcome.style.display='none';add(text,'user');q.value='';send.disabled=true;send.textContent='Denke …';const pending=add('Quantum.AI arbeitet …','ai',false);try{const r=await fetch(API_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text,history})});const d=await r.json();pending.remove();if(d.session_id){sessionId=d.session_id;localStorage.setItem('quantum_ai_session',sessionId)}add(d.ok?(d.response||d.answer||'Keine Antwort erhalten.'):d.error||'Die KI konnte keine Antwort erzeugen.','ai')}catch(_){pending.remove();add('Verbindung fehlgeschlagen. Prüfe Render und den KI-Dienst.','ai')}finally{send.disabled=false;send.textContent='Senden';q.focus()}};
</script><script>

i-action="read">🔊 Vorlesen</button><button type="button" data-ai-action="stop">⏹ Stoppen</button><button type="button" data-ai-action="export">📄 Text exportieren</button><button type="button" data-ai-action="clear">↻ Eingabe leeren</button><div class="ai-tools-note">Werkzeuge für die vorhandene Website-Oberfläche.</div></div></details></div><script id="ai-tools-menu-script">(()=>{const d=document.getElementById('ai-tools-dock');if(!d||d.dataset.ready)return;d.dataset.ready='1';const input=()=>document.querySelector('textarea:not([disabled]),input[type="text"]:not([disabled]),[contenteditable="true"]');const visible=e=>e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length);const msgs=()=>[...document.querySelectorAll('[data-message],.message,.chat-message,.bot-message,.assistant-message,.chat-bubble,[role="log"]')].filter(visible);const note=t=>{const n=d.querySelector('.ai-tools-note');if(n)n.textContent=t};d.addEventListener('click',e=>{const b=e.target.closest('[data-ai-action]');if(!b)return;const a=b.dataset.aiAction;if(a==='chat'){const x=input();if(x){x.focus();x.scrollIntoView({behavior:'smooth',block:'center'});note('Eingabefeld fokussiert.')}else note('Kein Eingabefeld gefunden.')}if(a==='voice'){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){note('Diktieren wird nicht unterstützt.');return}const r=new R();r.lang=document.documentElement.lang||'de-DE';r.onresult=v=>{const x=input();if(x){x.value=(x.value||'')+v.results[0][0].transcript;x.dispatchEvent(new Event('input',{bubbles:true}));x.focus();note('Diktat eingefügt.')}};r.onerror=()=>note('Diktat fehlgeschlagen.');r.start();note('Ich höre zu …')}if(a==='read'){const t=msgs().map(x=>x.innerText).filter(Boolean).join('\n');if(!t){note('Keine lesbaren Nachrichten gefunden.');return}if(!('speechSynthesis'in window)){note('Vorlesen nicht unterstützt.');return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t.slice(-12000)));note('Vorlesen gestartet.'
