<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum.AI</title><style>:root{--a:#7c6cff}*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#ececef;font:14px Inter,system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-columns:245px 1fr}.side{border-right:1px solid #27272a;padding:14px;background:#101113}.new{width:100%;padding:11px;border:1px solid #303036;border-radius:10px;background:#18181b;color:#fff;text-align:left}.brand{font-weight:800;font-size:17px;margin:14px 4px 22px}.nav{margin-top:18px;color:#a1a1aa;font-size:12px}.nav a{display:block;color:#cfcfd4;text-decoration:none;padding:10px;border-radius:9px;margin:3px 0}.nav a:hover{background:#1b1b1f}.nav .active{background:#1b1b1f;border-left:2px solid var(--a)}.main{display:grid;grid-template-rows:58px 1fr auto}.top{border-bottom:1px solid #27272a;display:flex;align-items:center;padding:0 22px;gap:12px}.model{color:#aaa;border:1px solid #303036;border-radius:999px;padding:5px 9px;font-size:11px}.chat{width:min(880px,92%);margin:auto;height:100%;overflow:auto;padding:30px 0 110px}.welcome{text-align:center;margin:20vh 0 0}.welcome h1{font-size:30px;margin:0 0 10px}.welcome p{color:#9b9ba3}.m{max-width:780px;margin:18px auto;padding:12px 14px;line-height:1.65;white-space:pre-wrap}.user{background:#18181b;border-radius:16px}.ai{border-left:2px solid var(--a)}.composer{width:min(880px,92%);margin:0 auto 18px;display:flex;gap:9px;border:1px solid #3a3a40;border-radius:18px;background:#151518;padding:9px;box-shadow:0 8px 30px #0008}.composer input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:10px;font:inherit}.composer button{border:0;border-radius:12px;background:var(--a);color:#09090b;font-weight:800;padding:0 17px}.engine{border:1px solid #303036;background:#18181b;color:#ddd;border-radius:9px;padding:7px 10px;text-decoration:none;font-size:11px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.chat{width:94%}.composer{width:94%}}</style></head><body><div class="app"><aside class="side"><button class="new">＋ Neuer Chat</button><div class="brand">Quantum.AI</div><div class="nav"><a class="active">⌁ Chat</a><a href="/engine">◈ Game Engine</a><a>⌕ Recherche</a><a>▣ Projekte</a><a>⚙ Einstellungen</a></div><div style="position:absolute;bottom:18px;color:#777;font-size:10px">Independent AI · Research · Engineering</div></aside><main class="main"><header class="top"><b>Quantum.AI</b><span class="model">GPT-6 Astra · High reasoning</span><a class="engine" href="/engine">Game Engine →</a></header><section class="chat" id="chat"><div class="welcome"><h1>Wie kann ich helfen?</h1><p>Recherche · Reasoning · Coding · Projekte · Game Development</p></div></section><form class="composer"><input id="q" placeholder="Nachricht an Quantum.AI …" autocomplete="off"><button>Senden</button></form></main></div><script>const f=document.querySelector('form'),q=document.querySelector('#q'),c=document.querySelector('#chat');function add(t,k){const e=document.createElement('div');e.className='m '+k;e.textContent=t;c.appendChild(e);c.scrollTop=c.scrollHeight}f.onsubmit=async e=>{e.preventDefault();const x=q.value.trim();if(!x)return;add(x,'user');q.value='';add('Denke …','ai');const w=c.lastChild;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:x})});const d=await r.json();w.remove();add(d.response||d.reply||d.response||d.error||'Keine Antwort','ai')}catch(_){w.remove();add('Verbindung fehlgeschlagen.','ai')}};</script></body></html>
