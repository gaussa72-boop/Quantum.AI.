name: Release Apps
on: {workflow_dispatch: null, push: {tags: ['v*']}}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p dist && cp -R app/. dist/ 2>/dev/null || cp -R web/. dist/ && cd dist && zip -r ../quantum-ai-web.zip .
      - uses: actions/upload-artifact@v4
        with: {name: quantum-ai-web, path: quantum-ai-web.zip}
  release:
    if: startsWith(github.ref,'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - uses: softprops/action-gh-release@v2
        with: {generate_release_notes: true, files: artifacts/**/*}